[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "costmon"
version = "0.1.0"
description = "Find over-provisioned Kubernetes workloads and estimate what they cost, from Prometheus metrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
costmon = "costmon.cli:main"
costmon-mcp = "costmon.mcp_server:main"

[tool.setuptools]
# Explicit: tests/ is also a package, which breaks flat-layout auto-discovery.
packages = ["costmon"]
