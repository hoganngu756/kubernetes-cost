# Mid-size queue consumer, balanced on both axes.
#
# Honestly requested -> must NOT be flagged. The busy phase is throttled by the
# 200m CPU limit, so average usage is limit * (busy/cycle) =
# 200m * 2/6s = 66m (see rightsized-worker for the derivation).
# Expected: CPU ~67%, memory ~77%.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-consumer
  namespace: cost-demo
spec:
  replicas: 6
  selector:
    matchLabels:
      app: event-consumer
  template:
    metadata:
      labels:
        app: event-consumer
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              dd if=/dev/zero of=/ballast/block bs=1M count=48
              while true; do
                end=$(($(date +%s) + 2))
                while [ $(date +%s) -lt $end ]; do :; done
                sleep 4
              done
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: ballast
              mountPath: /ballast
      volumes:
        - name: ballast
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
