# Control case: requested honestly. Expected: CPU efficiency ~77%, memory ~75%
# -> must NOT be flagged. If this one shows up in the report, the threshold or
# the math is wrong.
#
# Duty cycle: the busy phase is throttled by the 300m CPU limit (a single-
# threaded loop wants a full core, cgroup CFS quota caps it), so average usage
# is limit * (busy_seconds / cycle_seconds), not simply "however long the busy
# phase runs". 3s busy / 9s cycle -> 300m * 3/9 = 100m average, independently
# verified against the live cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rightsized-worker
  namespace: cost-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rightsized-worker
  template:
    metadata:
      labels:
        app: rightsized-worker
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              dd if=/dev/zero of=/ballast/block bs=1M count=48
              while true; do
                end=$(($(date +%s) + 3))
                while [ $(date +%s) -lt $end ]; do :; done
                sleep 6
              done
          resources:
            requests:
              cpu: 130m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          volumeMounts:
            - name: ballast
              mountPath: /ballast
      volumes:
        - name: ballast
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
